aid: equiptal-holding-ltd
name: EQUIPTAL HOLDING LTD
description: >-
  EQUIPTAL HOLDING LTD operates Moedatech (معداتك), Saudi Arabia's first digital
  procurement and rental marketplace for heavy construction equipment, connecting
  contractors with verified suppliers of excavators, cranes, and trucks through
  RFQs, real-time bidding, and audit-ready digital contracts. Founded in Riyadh in
  2020 by Ali Merie and Mansour Hmaid, the company pairs the marketplace with a
  telematics/fleet layer (built on Traccar GPS tracking) so equipment owners can
  monitor real-time asset performance. The product ships as iOS and Android apps
  plus a web app; there is no publicly documented developer API at this time. The
  company is backed by 500 Global and Plug and Play Middle East. This profile was
  surfaced from the 500 Global portfolio and enriched from the company's public
  web, brand (moedatech.net), and GitHub presence.
